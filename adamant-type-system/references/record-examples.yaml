# Reference: Record Type Examples
# These are real-world patterns from an Adamant project

# --- Simple record with floats and integer ---
# attitude_command.record.yaml
---
description: "Attitude rate command for 3-axis control"
with:
  - Interfaces
fields:
  - name: Roll_Rate
    type: Short_Float
    format: F32
    description: "Roll rate command in rad/sec"
  - name: Pitch_Rate
    type: Short_Float
    format: F32
  - name: Yaw_Rate
    type: Short_Float
    format: F32
  - name: Mode
    type: Interfaces.Unsigned_8
    format: U8
# Total: 32+32+32+8 = 104 bits = 13 bytes ✓

