# --- Sub-byte bitfield record ---
# fault_flags.record.yaml
# ---
# preamble: |
#   subtype Single_Bit_Type is Interfaces.Unsigned_8 range 0 .. 1;
#   subtype Four_Bit_Type is Interfaces.Unsigned_8 range 0 .. 15;
# with:
#   - Interfaces
# fields:
#   - name: Over_Temp
#     type: Single_Bit_Type
#     format: U1
#   - name: Over_Pressure
#     type: Single_Bit_Type
#     format: U1
#   - name: Under_Pressure
#     type: Single_Bit_Type
#     format: U1
#   - name: Valve_Stuck
#     type: Single_Bit_Type
#     format: U1
#   - name: Reserved
#     type: Four_Bit_Type
#     format: U4
# Total: 1+1+1+1+4 = 8 bits = 1 byte ✓

