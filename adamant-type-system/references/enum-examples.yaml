# Reference: Enum Type Examples

# --- Enum with explicit values ---
# valve_state_enums.enums.yaml
---
enums:
  - name: Valve_State_Type
    literals:
      - name: Closed
        value: 0
      - name: Opening
        value: 1
      - name: Open
        value: 2
      - name: Closing
        value: 3

